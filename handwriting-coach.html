<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Adaptive Handwriting Coach — Student Practice Closed Loop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --indigo:#4F46E5;
    --indigo-dark:#3C34C4;
    --blue:#3B82F6;
    --mint:#34D399;
    --mint-deep:#0F9D6B;
    --amber:#F59E0B;
    --amber-deep:#B97008;
    --offwhite:#FAFAFA;
    --ink:#211C3A;
    --ink-soft:#5B5478;
    --surface:#FFFFFF;
    --lavender:#EEF0FF;
    --lavender-deep:#E1E4FB;
    --line:#E5E2F5;
    --radius:22px;
    --radius-sm:14px;
    --shadow: 0 10px 30px -12px rgba(79,70,229,0.22);
    --shadow-sm: 0 4px 14px -6px rgba(33,28,58,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, #EEF0FF 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #E7FBF3 0%, transparent 55%),
      var(--offwhite);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2','Inter',sans-serif;
    letter-spacing:0.2px;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; }

  /* ---------- App shell ---------- */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px; max-width:1080px; margin:0 auto; flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:36px; height:36px; flex:none; }
  .brand-name{ font-family:'Baloo 2'; font-weight:700; font-size:19px; color:var(--ink); }
  .brand-sub{ font-size:11px; color:var(--ink-soft); font-weight:600; letter-spacing:0.4px; text-transform:uppercase; margin-top:-2px;}
  
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  #role-pill{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    padding:6px 8px 6px 14px; border-radius:999px; box-shadow:var(--shadow-sm); font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  #role-pill button{
    background:var(--lavender); border:none; color:var(--indigo); font-weight:700; font-size:12px;
    padding:8px 14px; border-radius:999px; transition:background .15s ease;
  }
  #role-pill button:hover{ background:var(--lavender-deep); }

  .input-toggle{
    display:inline-flex; align-items:center; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:3px; box-shadow:var(--shadow-sm); font-size:12px; font-weight:700;
  }
  .input-toggle button{
    border:none; background:none; padding:5px 12px; border-radius:999px; color:var(--ink-soft); transition:all .15s ease;
  }
  .input-toggle button.active{
    background:var(--indigo); color:#fff;
  }

  #screen{ max-width:1080px; margin:0 auto; padding:8px 22px 70px; animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); padding:26px; position:relative;
  }
  .stack{ display:flex; flex-direction:column; gap:18px; }
  .row{ display:flex; gap:18px; flex-wrap:wrap; }
  .grow{ flex:1 1 260px; }
  .muted{ color:var(--ink-soft); }
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--indigo);
  }

  .btn{
    border:none; border-radius:14px; padding:14px 22px; font-weight:700; font-size:15px;
    min-height:44px; display:inline-flex; align-items:center; gap:8px; justify-content:center;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease; text-decoration:none;
  }
  .btn-primary{ background:var(--indigo); color:#fff; box-shadow:0 8px 20px -8px rgba(79,70,229,0.55); }
  .btn-primary:hover{ background:var(--indigo-dark); transform:translateY(-1px); }
  .btn-ghost{ background:var(--lavender); color:var(--indigo); }
  .btn-ghost:hover{ background:var(--lavender-deep); }
  .btn-mint{ background:var(--mint); color:#04382A; }
  .btn-mint:hover{ filter:brightness(0.97); }
  .btn[disabled]{ opacity:0.45; cursor:not-allowed; }
  .btn-block{ width:100%; }

  /* ---------- Student home ---------- */
  .student-hero-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:32px; box-shadow:var(--shadow-sm); text-align:left;
  }
  .avatar-row{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .student-avatar{
    width:68px; height:68px; border-radius:22px; background:linear-gradient(135deg,var(--indigo),var(--blue));
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:32px; box-shadow:0 10px 22px -10px rgba(79,70,229,0.6);
  }
  .streak-pill{
    background:rgba(245,158,11,0.15); color:var(--amber-deep); border-radius:999px; padding:6px 14px;
    font-weight:800; font-size:13px; display:inline-flex; align-items:center; gap:6px;
  }

  .main-btn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:24px; }
  @media (max-width:680px){ .main-btn-grid{ grid-template-columns:1fr; } }

  .big-action-btn{
    border-radius:24px; padding:28px 24px; color:#fff; text-align:left; border:none; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; display:flex; flex-direction:column; gap:12px;
  }
  .big-action-btn:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .big-action-btn.primary{ background:linear-gradient(145deg, var(--indigo), #6366F1); }
  .big-action-btn.secondary{ background:linear-gradient(145deg, #0F9D6B, #34D399); color:#04382A; }
  .big-action-btn h3{ margin:0; font-size:22px; }
  .big-action-btn p{ margin:0; font-size:14px; opacity:0.92; line-height:1.5; }

  /* ---------- Protocol / game ---------- */
  .protocol-steps{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .step-chip{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:var(--lavender);
    font-size:13px; font-weight:700; color:var(--ink-soft);
  }
  .step-chip.active{ background:var(--indigo); color:#fff; }
  .step-chip.done{ background:var(--mint); color:#04382A; }

  .game-wrap{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .canvas-shell{
    width:100%; max-width:520px; aspect-ratio:1/1; border-radius:26px; background:var(--lavender);
    border:2px solid var(--line); position:relative; overflow:hidden; touch-action:none;
    box-shadow:inset 0 2px 10px rgba(79,70,229,0.08);
  }
  .canvas-shell canvas{ width:100%; height:100%; display:block; touch-action:none; }
  .coach-banner{
    position:absolute; top:12px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.92);
    border-radius:999px; padding:8px 18px; font-weight:700; font-size:13px; box-shadow:var(--shadow-sm); color:var(--ink);
    display:flex; align-items:center; gap:8px; backdrop-filter:blur(4px); white-space:nowrap; z-index:5;
  }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.green{ background:var(--mint); }
  .dot.amber{ background:var(--amber); }
  .game-controls{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .validation-toast{
    background:#FFF7E8; border:1px solid var(--amber); color:var(--amber-deep); padding:14px 18px;
    border-radius:14px; font-size:14px; font-weight:600; text-align:center; box-shadow:var(--shadow-sm);
  }

  /* ---------- Paper Scan UI ---------- */
  .paper-samples{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:12px; }
  .sample-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px;
    text-align:center; font-size:12px; font-weight:700; color:var(--ink-soft); transition:all .15s ease;
  }
  .sample-btn:hover, .sample-btn.selected{ border-color:var(--indigo); background:var(--lavender); color:var(--indigo); }
  .paper-canvas-wrap{
    width:100%; max-width:600px; aspect-ratio:4/3; margin:0 auto; border-radius:18px; overflow:hidden;
    background:#F3F4F6; border:2px dashed var(--indigo); position:relative; display:flex; align-items:center; justify-content:center;
  }
  .paper-canvas-wrap canvas{ width:100%; height:100%; object-fit:contain; }

  /* ---------- Analysing ---------- */
  .analysing-wrap{ text-align:center; padding:60px 10px; }
  .pulse-ring{
    width:96px; height:96px; margin:0 auto 22px; border-radius:50%; border:6px solid var(--lavender);
    border-top-color:var(--indigo); animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .analysing-lines{ color:var(--ink-soft); font-size:14px; margin-top:6px; font-weight:600; }

  /* ---------- Results ---------- */
  .skill-bar-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .skill-bar-head{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:700; }
  .skill-bar-head .name{ color:var(--ink); }
  .skill-bar-head .score{ font-family:'JetBrains Mono'; color:var(--ink-soft); }
  .skill-bar-track{ height:12px; border-radius:999px; background:var(--lavender); overflow:hidden; }
  .skill-bar-fill{ height:100%; border-radius:999px; transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .skill-explain{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; font-weight:500; }

  .replay-shell{
    background:var(--ink); border-radius:var(--radius); padding:22px; position:relative; color:#fff;
  }
  .replay-canvas-wrap{ width:100%; max-width:420px; aspect-ratio:1/1; margin:0 auto; border-radius:18px; overflow:hidden; background:#171233; }
  .replay-controls{ display:flex; align-items:center; gap:12px; margin-top:14px; }
  .replay-controls input[type=range]{ flex:1; accent-color:var(--mint); }
  .replay-play{
    width:40px; height:40px; border-radius:50%; background:var(--mint); border:none; color:#04382A;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; font-weight:bold;
  }
  .replay-legend{ display:flex; gap:16px; margin-top:12px; font-size:12px; color:#C9C6EF; flex-wrap:wrap; }
  .legend-swatch{ display:inline-flex; align-items:center; gap:6px; }
  .legend-line{ width:18px; height:3px; border-radius:2px; display:inline-block; }

  /* ---------- Practice / ladder ---------- */
  .ladder{ display:flex; flex-direction:column-reverse; gap:10px; }
  .rung{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:14px; background:var(--lavender); font-weight:600; }
  .rung.current{ background:var(--indigo); color:#fff; font-weight:700; box-shadow:var(--shadow-sm); }
  .rung.unlocked{ background:var(--mint); color:#04382A; font-weight:700; }
  .rung .rung-idx{ width:26px; height:26px; border-radius:8px; background:rgba(79,70,229,0.15); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; }
  .rung.current .rung-idx{ background:rgba(255,255,255,0.25); color:#fff; }
  .rung.unlocked .rung-idx{ background:rgba(4,56,42,0.15); color:#04382A; }

  .letter-picker{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .letter-chip{
    width:42px; height:42px; border-radius:12px; border:2px solid var(--line); background:#fff;
    font-family:'Baloo 2'; font-weight:800; font-size:18px; color:var(--ink-soft); display:flex;
    align-items:center; justify-content:center; cursor:pointer; transition:all .15s ease;
  }
  .letter-chip:hover, .letter-chip.active{ border-color:var(--indigo); background:var(--indigo); color:#fff; }

  /* ---------- Teacher dashboard ---------- */
  table.heatmap{ width:100%; border-collapse:separate; border-spacing:0 8px; font-size:13px; }
  table.heatmap th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); padding:0 10px 4px; font-weight:700; }
  table.heatmap td{ padding:12px 10px; background:var(--surface); }
  table.heatmap tr td:first-child{ border-radius:14px 0 0 14px; font-weight:700; }
  table.heatmap tr td:last-child{ border-radius:0 14px 14px 0; }
  .heat-cell{ display:flex; align-items:center; justify-content:center; }
  .heat-pill{ min-width:42px; text-align:center; padding:6px 8px; border-radius:10px; font-family:'JetBrains Mono'; font-weight:700; font-size:12px; }
  .heat-green{ background:#E4FAF1; color:var(--mint-deep); }
  .heat-amber{ background:#FFF3DE; color:var(--amber-deep); }
  tr.row-btn{ cursor:pointer; transition:transform .1s ease; }
  tr.row-btn:hover{ transform:translateX(2px); }

  .override-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .chip{ border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700; color:var(--ink-soft); min-height:40px; cursor:pointer; }
  .chip.picked{ background:var(--mint); border-color:var(--mint); color:#04382A; }
  .chip:hover{ border-color:var(--indigo); color:var(--indigo); }

  .sparkline{ width:100%; height:70px; }

  /* ---------- Parent view ---------- */
  .tip-card{ display:flex; gap:14px; align-items:flex-start; background:var(--lavender); border-radius:16px; padding:16px 18px; }
  .tip-num{ font-family:'Baloo 2'; font-weight:800; color:var(--indigo); font-size:20px; flex:none; }

  .back-link{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-weight:700; font-size:13px; margin-bottom:14px; background:none; border:none; padding:6px 0; }
  .back-link:hover{ color:var(--indigo); }

  .two-col{ display:grid; grid-template-columns: 1.1fr 0.9fr; gap:22px; }
  @media (max-width: 820px){ .two-col{ grid-template-columns:1fr; } }

  ::selection{ background:var(--indigo); color:#fff; }
</style>
</head>
<body>
<div id="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="19" fill="#4F46E5"/>
      <path d="M12 26 C12 18, 16 12, 20 12 C24 12, 24 17, 20.5 18.5 C17 20, 15 23, 15 27" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <circle cx="15" cy="27" r="2.1" fill="#34D399"/>
    </svg>
    <div>
      <div class="brand-name">Adaptive Handwriting Coach</div>
      <div class="brand-sub">Kinematic &amp; Paper Hybrid Platform</div>
    </div>
  </div>
  <div class="top-controls">
    <div class="input-toggle" id="input-toggle">
      <button id="toggle-pen" class="active">🖊 Stylus</button>
      <button id="toggle-finger">👆 Finger</button>
    </div>
    <div id="role-pill">
      <span id="role-pill-label">Student view</span>
      <button id="switch-role-btn">Switch</button>
    </div>
  </div>
</div>
<div id="screen"></div>

<script>
/* =========================================================================
   CLEAN VECTOR STROKE ENGINE & CLOSED LOOP STUDENT PRACTICE
   ========================================================================= */

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// Vector stroke helpers
function linePath(x1, y1, x2, y2, steps=30){
  const pts = [];
  for(let k=0; k<=steps; k++) pts.push({x: lerp(x1, x2, k/steps), y: lerp(y1, y2, k/steps)});
  return pts;
}

function arcPath(cx, cy, r, startAng, endAng, counterClockwise=false, steps=40){
  const pts = [];
  let range = endAng - startAng;
  if(counterClockwise && range > 0) range -= Math.PI*2;
  for(let k=0; k<=steps; k++){
    const ang = startAng + (k/steps)*range;
    pts.push({x: cx + r*Math.cos(ang), y: cy + r*Math.sin(ang)});
  }
  return pts;
}

function ellipsePath(cx, cy, rx, ry, steps=50){
  const pts = [];
  for(let k=0; k<=steps; k++){
    const ang = (k/steps)*Math.PI*2 - Math.PI/2;
    pts.push({x: cx + rx*Math.cos(ang), y: cy + ry*Math.sin(ang)});
  }
  return pts;
}

function sCurvePath(cx, cy, w, h, steps=50){
  const pts = [];
  for(let k=0; k<=steps; k++){
    const t = k/steps;
    const y = (cy - h/2) + t*h;
    const x = cx + Math.sin(t * Math.PI * 2) * (w/2);
    pts.push({x, y});
  }
  return pts;
}

// Clean Vector Stroke Generators for Alphabet Letters
function generateLetterStrokes(letter, size = 600) {
  const cx = size / 2, cy = size / 2;
  const h = 240, w = 190;
  const top = cy - h/2, bot = cy + h/2;
  const left = cx - w/2, right = cx + w/2;

  const letterMap = {
    'A': [
      linePath(cx, top, left, bot),
      linePath(cx, top, right, bot),
      linePath(cx - w/3, cy + 25, cx + w/3, cy + 25)
    ],
    'K': [
      linePath(left + 25, top, left + 25, bot),
      linePath(right - 10, top + 10, left + 25, cy),
      linePath(left + 35, cy - 10, right - 10, bot - 10)
    ],
    'M': [
      linePath(left, bot, left, top),
      linePath(left, top, cx, cy + 40),
      linePath(cx, cy + 40, right, top),
      linePath(right, top, right, bot)
    ],
    'N': [
      linePath(left, bot, left, top),
      linePath(left, top, right, bot),
      linePath(right, bot, right, top)
    ],
    'V': [
      linePath(left, top, cx, bot),
      linePath(cx, bot, right, top)
    ],
    'W': [
      linePath(left, top, left + w/4, bot),
      linePath(left + w/4, bot, cx, cy - 10),
      linePath(cx, cy - 10, right - w/4, bot),
      linePath(right - w/4, bot, right, top)
    ],
    'X': [
      linePath(left, top, right, bot),
      linePath(right, top, left, bot)
    ],
    'Z': [
      linePath(left, top, right, top),
      linePath(right, top, left, bot),
      linePath(left, bot, right, bot)
    ],
    'E': [
      linePath(left, top, left, bot),
      linePath(left, top, right - 20, top),
      linePath(left, cy, right - 40, cy),
      linePath(left, bot, right - 20, bot)
    ],
    'F': [
      linePath(left, top, left, bot),
      linePath(left, top, right - 20, top),
      linePath(left, cy, right - 40, cy)
    ],
    'H': [
      linePath(left, top, left, bot),
      linePath(right, top, right, bot),
      linePath(left, cy, right, cy)
    ],
    'I': [
      linePath(cx, top, cx, bot),
      linePath(left + 30, top, right - 30, top),
      linePath(left + 30, bot, right - 30, bot)
    ],
    'L': [
      linePath(left + 30, top, left + 30, bot),
      linePath(left + 30, bot, right - 20, bot)
    ],
    'T': [
      linePath(left, top, right, top),
      linePath(cx, top, cx, bot)
    ],
    'P': [
      linePath(left + 30, top, left + 30, bot),
      arcPath(left + 30, top + h/4, h/4, -Math.PI/2, Math.PI/2)
    ],
    'B': [
      linePath(left + 30, top, left + 30, bot),
      arcPath(left + 30, top + h/4, h/4, -Math.PI/2, Math.PI/2),
      arcPath(left + 30, cy + h/4, h/4, -Math.PI/2, Math.PI/2)
    ],
    'R': [
      linePath(left + 30, top, left + 30, bot),
      arcPath(left + 30, top + h/4, h/4, -Math.PI/2, Math.PI/2),
      linePath(left + 30, cy, right - 10, bot)
    ],
    'D': [
      linePath(left + 30, top, left + 30, bot),
      arcPath(left + 30, cy, h/2, -Math.PI/2, Math.PI/2)
    ],
    'C': [
      arcPath(cx + 20, cy, h/2, Math.PI*0.25, Math.PI*1.75, true)
    ],
    'O': [
      ellipsePath(cx, cy, w/2, h/2)
    ],
    'G': [
      arcPath(cx + 20, cy, h/2, Math.PI*0.2, Math.PI*1.75, true),
      linePath(cx, cy, right, cy)
    ],
    'Q': [
      ellipsePath(cx, cy, w/2, h/2),
      linePath(cx + 20, cy + 20, right + 10, bot + 10)
    ],
    'S': [
      sCurvePath(cx, cy, w, h)
    ]
  };

  return letterMap[letter] || letterMap['A'];
}

// Resampling helper
function resamplePoints(points, targetSpacingPx = 4.0){
  if(points.length < 2) return points;
  const resampled = [points[0]];
  for(let i=1; i<points.length; i++){
    const prev = resampled[resampled.length-1];
    const curr = points[i];
    const d = dist(prev, curr);
    if(d >= targetSpacingPx){
      const steps = Math.floor(d / targetSpacingPx);
      for(let s=1; s<=steps; s++){
        const frac = (s * targetSpacingPx) / d;
        resampled.push({
          x: lerp(prev.x, curr.x, frac),
          y: lerp(prev.y, curr.y, frac),
          t: lerp(prev.t, curr.t, frac),
          p: lerp(prev.p||0.5, curr.p||0.5, frac)
        });
      }
    }
  }
  return resampled;
}

// DTW Math
function computeDTWDistance(seqA, seqB){
  const N = Math.min(seqA.length, 120);
  const M = Math.min(seqB.length, 120);
  if(!N || !M) return 0;
  
  const stepA = Math.max(1, Math.floor(seqA.length / N));
  const stepB = Math.max(1, Math.floor(seqB.length / M));
  
  const dtw = Array.from({length: N+1}, () => new Float32Array(M+1).fill(1e6));
  dtw[0][0] = 0;

  for(let i=1; i<=N; i++){
    for(let j=1; j<=M; j++){
      const ptA = seqA[(i-1)*stepA] || seqA[seqA.length-1];
      const ptB = seqB[(j-1)*stepB] || seqB[seqB.length-1];
      const cost = dist(ptA, ptB);
      dtw[i][j] = cost + Math.min(dtw[i-1][j], dtw[i][j-1], dtw[i-1][j-1]);
    }
  }
  return dtw[N][M] / (N + M);
}

// Validation Gate
function validateSession(points, inputType="pen"){
  if(!points || points.length < 12) return {status:'ERROR', reason:"Trace was a bit short — let's give that one another try!"};
  const deltas = [];
  for(let i=1; i<points.length; i++) deltas.push(points[i].t - points[i-1].t);
  const meanDt = deltas.reduce((a,b)=>a+b,0)/deltas.length;
  const stdDt = Math.sqrt(deltas.reduce((a,b)=>a+(b-meanDt)**2,0)/deltas.length);
  if(stdDt > 38.0) return {status:'ERROR', reason:"Signal looked a little jittery — let's try again smoothly."};
  const totalDuration = (points[points.length-1].t - points[0].t)/1000.0;
  if(totalDuration < 0.45) return {status:'ERROR', reason:"That was really quick — try tracing at a gentle pace."};
  return {status:'SUCCESS'};
}

// Kinematics Calculation (returns null if no real points captured)
function computeRealKinematics(rawPoints, inputType="pen", idealTemplate=[]){
  if(!rawPoints || rawPoints.length < 5){
    return null;
  }

  const pts = resamplePoints(rawPoints, 3.5);
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const bboxW = Math.max(maxX - minX, 1);
  const bboxH = Math.max(maxY - minY, 1);
  const aspect = bboxW / bboxH;

  const velocities = [];
  const accelerations = [];
  const jerks = [];

  for(let i=1; i<pts.length; i++){
    const dt = Math.max((pts[i].t - pts[i-1].t)/1000.0, 0.001);
    velocities.push(dist(pts[i], pts[i-1]) / dt);
  }

  for(let i=1; i<velocities.length; i++){
    const dt = Math.max((pts[i+1].t - pts[i].t)/1000.0, 0.001);
    accelerations.push((velocities[i] - velocities[i-1]) / dt);
  }

  for(let i=1; i<accelerations.length; i++){
    const dt = Math.max((pts[i+2].t - pts[i+1].t)/1000.0, 0.001);
    jerks.push(Math.abs((accelerations[i] - accelerations[i-1]) / dt));
  }

  const meanJerk = jerks.length ? jerks.reduce((a,b)=>a+b,0)/jerks.length : 1200;
  const movement_smoothness = clamp(100 - (meanJerk / 450.0), 22, 98);

  const meanVel = velocities.length ? velocities.reduce((a,b)=>a+b,0)/velocities.length : 100;
  const stdVel = velocities.length ? Math.sqrt(velocities.reduce((a,b)=>a+(b-meanVel)**2,0)/velocities.length) : 50;
  const cvVel = meanVel > 0 ? (stdVel / meanVel) : 1.0;
  const pacing_consistency = clamp(100 - (cvVel * 55.0), 25, 98);

  let pauseDuration = 0;
  for(let i=0; i<velocities.length; i++){
    if(velocities[i] < 12.0) pauseDuration += (pts[i+1].t - pts[i].t);
  }
  const totalDuration = pts[pts.length-1].t - pts[0].t;
  const pauseRatio = totalDuration > 0 ? pauseDuration / totalDuration : 0;
  const cognitive_hesitation = clamp(100 - (pauseRatio * 180.0), 20, 98);

  const idealAspect = idealTemplate.aspect || 1.0;
  const aspectErr = Math.abs(aspect - idealAspect);
  const spatial_proportionality = clamp(100 - (aspectErr * 75.0), 25, 98);

  let orientationScore = 88;
  if(idealTemplate.points && idealTemplate.points.length > 5){
    const dtwDist = computeDTWDistance(pts, idealTemplate.points);
    orientationScore = clamp(100 - (dtwDist * 1.4), 25, 98);
  }

  let trackingErr = 15;
  if(idealTemplate.points && idealTemplate.points.length){
    let sumErr = 0;
    pts.forEach(p => {
      let minD = Infinity;
      for(let j=0; j<idealTemplate.points.length; j+=4){
        const d = dist(p, idealTemplate.points[j]);
        if(d < minD) minD = d;
      }
      sumErr += minD;
    });
    trackingErr = sumErr / pts.length;
  }
  const target_tracking_error = clamp(100 - (trackingErr * 1.8), 25, 98);

  return {
    movement_smoothness: Math.round(movement_smoothness),
    pacing_consistency: Math.round(pacing_consistency),
    cognitive_hesitation: Math.round(cognitive_hesitation),
    spatial_proportionality: Math.round(spatial_proportionality),
    structural_orientation: Math.round(orientationScore),
    target_tracking_error: Math.round(target_tracking_error)
  };
}

// Computer Vision Paper Engine
const PaperVisionEngine = {
  analyzeCanvas(canvas){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    const gray = new Uint8Array(W * H);
    for(let i=0; i<data.length; i+=4){
      gray[i/4] = Math.round(0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2]);
    }

    const hist = new Int32Array(256);
    for(let i=0; i<gray.length; i++) hist[gray[i]]++;
    let total = gray.length, sum = 0;
    for(let i=0; i<256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, wF = 0, maxVar = 0, threshold = 128;
    for(let t=0; t<256; t++){
      wB += hist[t]; if(wB === 0) continue;
      wF = total - wB; if(wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB;
      const mF = (sum - sumB) / wF;
      const varBetween = wB * wF * (mB - mF) * (mB - mF);
      if(varBetween > maxVar){ maxVar = varBetween; threshold = t; }
    }

    const inkCentroidsX = [], inkCentroidsY = [];
    for(let y=0; y<H; y++){
      for(let x=0; x<W; x++){
        if(gray[y*W + x] < threshold){ inkCentroidsX.push(x); inkCentroidsY.push(y); }
      }
    }

    let slope = 0, intercept = H/2, alignVar = 20;
    if(inkCentroidsX.length > 20){
      const N = inkCentroidsX.length;
      let sumX=0, sumY=0, sumXY=0, sumXX=0;
      for(let i=0; i<N; i++){
        sumX += inkCentroidsX[i]; sumY += inkCentroidsY[i];
        sumXY += inkCentroidsX[i] * inkCentroidsY[i];
        sumXX += inkCentroidsX[i] * inkCentroidsX[i];
      }
      const denom = (N * sumXX - sumX * sumX);
      if(Math.abs(denom) > 1e-5){ slope = (N * sumXY - sumX * sumY) / denom; intercept = (sumY - slope * sumX) / N; }
      let errSum = 0;
      for(let i=0; i<N; i+=10){ errSum += (inkCentroidsY[i] - (slope * inkCentroidsX[i] + intercept))**2; }
      alignVar = Math.sqrt(errSum / (N/10));
    }
    const alignmentScore = clamp(100 - (Math.abs(slope)*1200 + alignVar*1.2), 25, 96);

    const colProj = new Int32Array(W);
    for(let x=0; x<W; x++){
      for(let y=0; y<H; y++){ if(gray[y*W + x] < threshold) colProj[x]++; }
    }
    const gaps = [];
    let inGlyph = false, currentGap = 0;
    for(let x=0; x<W; x++){
      if(colProj[x] < 3){ currentGap++; inGlyph = false; }
      else {
        if(!inGlyph && currentGap > 4 && currentGap < 100) gaps.push(currentGap);
        currentGap = 0; inGlyph = true;
      }
    }
    const meanGap = gaps.length ? gaps.reduce((a,b)=>a+b,0)/gaps.length : 18;
    const stdGap = gaps.length ? Math.sqrt(gaps.reduce((a,b)=>a+(b-meanGap)**2,0)/gaps.length) : 8;
    const spacingScore = clamp(100 - (stdGap * 4.2), 25, 96);

    let edgeJitter = 0, edgeCount = 0;
    for(let y=2; y<H-2; y+=4){
      for(let x=2; x<W-2; x+=4){
        if(gray[y*W + x] < threshold){
          const lap = Math.abs(4*gray[y*W+x] - gray[(y-1)*W+x] - gray[(y+1)*W+x] - gray[y*W+x-1] - gray[y*W+x+1]);
          if(lap > 40){ edgeJitter += lap; edgeCount++; }
        }
      }
    }
    const meanLap = edgeCount > 0 ? edgeJitter / edgeCount : 50;
    const curvesScore = clamp(100 - (meanLap * 0.45), 25, 96);

    return { alignment: Math.round(alignmentScore), spacing: Math.round(spacingScore), curves: Math.round(curvesScore), baseline: { slope, intercept } };
  }
};

// Ideal Shapes & Magic Wand Star Rune Generator
function generateSpiral(cx,cy,maxR,turns,steps){
  const pts=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps, theta=t*turns*Math.PI*2, r=t*maxR;
    pts.push({x:cx+r*Math.cos(theta), y:cy+r*Math.sin(theta)});
  }
  return { points: pts, aspect: 1.0 };
}
function bugPosAt(tSec,cx,cy,w,h){
  const a=(2*Math.PI)/6.4, b=(2*Math.PI)/4.6;
  return { x: cx + Math.sin(a*tSec)*w, y: cy + Math.sin(b*tSec + Math.PI/2)*h };
}
function generateRune(cx,cy,R){
  const n = 5;
  const pts=[];
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 - Math.PI/2;
    const r = R*(i%2===0? 0.95 : 0.45);
    pts.push({x:cx+r*Math.cos(ang), y:cy+r*Math.sin(ang)});
  }
  pts.push({...pts[0]});
  let ideal=[]; for(let i=0;i<pts.length-1;i++){
    for(let k=0; k<=30; k++) ideal.push({x:lerp(pts[i].x, pts[i+1].x, k/30), y:lerp(pts[i].y, pts[i+1].y, k/30)});
  }
  return { points: ideal, aspect: 1.0 };
}

function canvasPointFromEvent(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  return { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy, t:performance.now(), p:(e.pressure && e.pressure>0)? e.pressure : 0.5 };
}

function mountSpiralGame(mount){
  const canvas = gameShell(mount, '🌀 Galaxy Spiral', 'Trace from the center out to the edge, following the guide path.');
  const ctx = canvas.getContext('2d');
  const cx=300, cy=300, maxR=230, ideal = generateSpiral(cx,cy,maxR,3,420);
  let drawing=false, points=[];

  function drawBase(){
    ctx.clearRect(0,0,600,600);
    ctx.setLineDash([3,9]); ctx.lineWidth=3.5; ctx.strokeStyle = '#C9CBEF';
    ctx.beginPath(); ideal.points.forEach((p,i)=> i===0? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#4F46E5'; ctx.beginPath(); ctx.arc(cx,cy,8,0,Math.PI*2); ctx.fill();
  }
  drawBase();
  function setBanner(color,text){ const b=document.getElementById('coach-banner'); if(b) b.innerHTML = `<span class="dot ${color}"></span> ${text}`; }

  function pointerDown(e){
    canvas.setPointerCapture(e.pointerId); drawing=true; points=[canvasPointFromEvent(e,canvas)];
    setBanner('green','Nice start — keep going!');
  }
  function pointerMove(e){
    if(!drawing) return;
    const p = canvasPointFromEvent(e,canvas);
    const prev = points[points.length-1]; points.push(p);
    let minD = Infinity;
    for(let j=0; j<ideal.points.length; j+=6){ const d = dist(p, ideal.points[j]); if(d < minD) minD = d; }
    const good = minD < 32;
    ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y);
    ctx.lineWidth=6; ctx.lineCap='round'; ctx.strokeStyle = good ? '#34D399' : '#F59E0B'; ctx.stroke();
    setBanner(good?'green':'amber', good ? 'Smooth & on track' : 'A little off path — ease back on');
  }
  function pointerUp(){
    if(!drawing) return; drawing=false;
    const validation = validateSession(points, App.inputType);
    if(validation.status==='ERROR'){
      document.getElementById('toast-slot').innerHTML = `<div class="validation-toast">⚠ ${validation.reason}</div>`;
      return;
    }
    App.captures.spiral = { points, idealTemplate: ideal };
    setBanner('green', 'Captured! Moving on…');
    setTimeout(()=>{ App.gameIndex++; render(); }, 500);
  }
  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerup', pointerUp);
  document.getElementById('game-reset').addEventListener('click', ()=>{ drawing=false; points=[]; drawBase(); document.getElementById('toast-slot').innerHTML=''; setBanner('green','Ready when you are'); });
}

function mountBugGame(mount){
  const canvas = gameShell(mount, '🐞 Laser Bug Chase', 'Keep your finger/stylus right on the bug as it zips around for 8 seconds.');
  const ctx = canvas.getContext('2d');
  const cx=300, cy=300, w=220, h=170;
  let running=false, startT=null, raf=null, trail=[], playerPoints=[];
  const DURATION=8;

  function drawFrame(bugPos, playerPos){
    ctx.clearRect(0,0,600,600);
    ctx.strokeStyle='#DEE0FA'; ctx.lineWidth=2; ctx.setLineDash([2,8]);
    ctx.beginPath();
    for(let t=0;t<=DURATION;t+=0.05){ const p=bugPosAt(t,cx,cy,w,h); t===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
    ctx.stroke(); ctx.setLineDash([]);
    for(let i=1;i<trail.length;i++){
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y);
      ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle = trail[i].good ? '#34D399' : '#F59E0B'; ctx.stroke();
    }
    if(bugPos){ ctx.fillStyle='#4F46E5'; ctx.beginPath(); ctx.arc(bugPos.x,bugPos.y,14,0,Math.PI*2); ctx.fill(); }
    if(playerPos){ ctx.strokeStyle='#211C3A'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(playerPos.x,playerPos.y,10,0,Math.PI*2); ctx.stroke(); }
  }
  drawFrame(bugPosAt(0,cx,cy,w,h), null);
  let lastPlayer = {x:cx,y:cy};

  function setBanner(color,text){ const b=document.getElementById('coach-banner'); if(b) b.innerHTML = `<span class="dot ${color}"></span> ${text}`; }

  function loop(ts){
    if(!startT) startT=ts;
    const tSec = (ts-startT)/1000;
    if(tSec>=DURATION){ finish(); return; }
    const bug = bugPosAt(tSec,cx,cy,w,h);
    const d = dist(bug,lastPlayer);
    const good = d < (App.inputType==='finger'? 68 : 54);
    playerPoints.push({x:lastPlayer.x, y:lastPlayer.y, t:performance.now()});
    trail.push({x:lastPlayer.x,y:lastPlayer.y,good});
    if(trail.length>140) trail.shift();
    drawFrame(bug,lastPlayer);
    setBanner(good?'green':'amber', good ? 'Right on it!' : 'Chase it down!');
    raf = requestAnimationFrame(loop);
  }
  function finish(){
    running=false; cancelAnimationFrame(raf);
    App.captures.bug = { points: playerPoints };
    setBanner('green','Got it! Moving on…');
    setTimeout(()=>{ App.gameIndex++; render(); }, 500);
  }
  function pointerMove(e){
    if(!running) return;
    const rect = canvas.getBoundingClientRect(); const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    lastPlayer = { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy };
  }
  canvas.addEventListener('pointermove', pointerMove);
  canvas.addEventListener('pointerdown', (e)=>{
    if(running) return;
    canvas.setPointerCapture(e.pointerId); running=true; startT=null; trail=[]; playerPoints=[];
    const rect = canvas.getBoundingClientRect(); const sx=canvas.width/rect.width, sy=canvas.height/rect.height;
    lastPlayer = { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy };
    raf = requestAnimationFrame(loop);
  });
  document.getElementById('game-reset').addEventListener('click', ()=>{ running=false; cancelAnimationFrame(raf); drawFrame(bugPosAt(0,cx,cy,w,h), null); setBanner('green','Tap the bug to start'); });
  setBanner('green','Tap on the bug to start');
}

function mountWandGame(mount){
  const canvas = gameShell(mount, '🪄 Magic Wand Memory', 'Watch the rune glow for 2s, then trace it from memory!');
  const ctx = canvas.getContext('2d');
  const cx=300, cy=300, R=190;
  const idealRune = generateRune(cx,cy,R);

  function setBanner(color,text){ const b=document.getElementById('coach-banner'); if(b) b.innerHTML = `<span class="dot ${color}"></span> ${text}`; }

  function drawReveal(frac){
    ctx.clearRect(0,0,600,600);
    ctx.strokeStyle='#4F46E5'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
    const n = Math.floor(frac*idealRune.points.length);
    ctx.beginPath();
    for(let i=0;i<n;i++){ i===0 ? ctx.moveTo(idealRune.points[i].x,idealRune.points[i].y) : ctx.lineTo(idealRune.points[i].x,idealRune.points[i].y); }
    ctx.stroke();
    if(idealRune.points.length) { ctx.fillStyle='#34D399'; ctx.beginPath(); ctx.arc(idealRune.points[0].x,idealRune.points[0].y,8,0,Math.PI*2); ctx.fill(); }
  }

  let watchStart=null;
  function watchStep(ts){
    if(!watchStart) watchStart=ts;
    const frac = Math.min((ts-watchStart)/1800, 1);
    drawReveal(frac);
    if(frac<1) requestAnimationFrame(watchStep);
    else setTimeout(startHidePhase, 500);
  }
  requestAnimationFrame(watchStep);

  let drawing=false, points=[];

  function startHidePhase(){
    ctx.clearRect(0,0,600,600);
    setBanner('amber','Your turn — trace the rune from memory!');
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
  }

  function onDown(e){
    canvas.setPointerCapture(e.pointerId); drawing=true; points=[canvasPointFromEvent(e,canvas)];
  }
  function onMove(e){
    if(!drawing) return;
    const p = canvasPointFromEvent(e,canvas); const prev = points[points.length-1]; points.push(p);
    let minD = Infinity; for(let j=0; j<idealRune.points.length; j+=6){ const d = dist(p, idealRune.points[j]); if(d < minD) minD = d; }
    const good = minD<38;
    ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y); ctx.lineWidth=6; ctx.lineCap='round'; ctx.strokeStyle = good ? '#34D399' : '#F59E0B'; ctx.stroke();
    setBanner(good?'green':'amber', good ? 'Remembering well!' : 'Keep going!');
  }
  function onUp(){
    if(!drawing) return; drawing=false;
    const validation = validateSession(points, App.inputType);
    if(validation.status==='ERROR'){ document.getElementById('toast-slot').innerHTML = `<div class="validation-toast">⚠ ${validation.reason}</div>`; return; }
    App.captures.wand = { points, idealTemplate: idealRune };
    setBanner('green','Memory trace captured! Moving on…');
    setTimeout(()=>{ App.gameIndex++; render(); }, 500);
  }

  document.getElementById('game-reset').addEventListener('click', ()=>{ drawing=false; points=[]; ctx.clearRect(0,0,600,600); setBanner('amber','Trace the rune from memory!'); });
}

function mountSentenceGame(mount){
  const WORD = 'HERO';
  const canvas = gameShell(mount, "✍️ Hero's Sentence", `Trace each letter of "${WORD}", then tap Done.`);
  const ctx = canvas.getContext('2d');
  const letterStrokes = WORD.split('').map((l, idx) => {
    const charStrokes = generateLetterStrokes(l, 600);
    const xOff = (idx - 1.5) * 110;
    return charStrokes.map(stroke => stroke.map(p => ({x: p.x*0.55 + 160 + xOff, y: p.y*0.55 + 130})));
  }).flat();

  function drawGuide(){
    ctx.clearRect(0,0,600,600);
    ctx.save(); ctx.setLineDash([3,7]); ctx.strokeStyle='#C9CBEF'; ctx.lineWidth=4;
    letterStrokes.forEach(stroke => {
      ctx.beginPath(); stroke.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
    });
    ctx.restore();
  }
  drawGuide();

  function setBanner(color,text){ const b=document.getElementById('coach-banner'); if(b) b.innerHTML = `<span class="dot ${color}"></span> ${text}`; }
  let strokes=[], current=null;
  const flatGuide = letterStrokes.flat();

  canvas.addEventListener('pointerdown',(e)=>{ canvas.setPointerCapture(e.pointerId); current=[canvasPointFromEvent(e,canvas)]; });
  canvas.addEventListener('pointermove',(e)=>{
    if(!current) return;
    const p = canvasPointFromEvent(e,canvas); const prev = current[current.length-1]; current.push(p);
    let minD = Infinity; for(let j=0; j<flatGuide.length; j+=4){ const d = dist(p, flatGuide[j]); if(d < minD) minD = d; }
    const good = minD<26;
    ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y); ctx.lineWidth=7; ctx.lineCap='round'; ctx.strokeStyle = good ? '#34D399' : '#F59E0B'; ctx.stroke();
    setBanner(good?'green':'amber', good ? 'On the letter!' : 'Guide it back');
  });
  canvas.addEventListener('pointerup',()=>{ if(!current) return; if(current.length>=4) strokes.push(current); current=null; });
  document.getElementById('game-reset').addEventListener('click', ()=>{ strokes=[]; current=null; drawGuide(); setBanner('green','Trace the letters'); });
  
  const controls = mount.querySelector('.game-controls');
  if(controls){
    const doneBtn = document.createElement('button');
    doneBtn.className = 'btn btn-mint';
    doneBtn.textContent = 'Done Tracing →';
    doneBtn.addEventListener('click', ()=>{
      const allPts = strokes.flat();
      if(allPts.length<20){ document.getElementById('toast-slot').innerHTML = `<div class="validation-toast">⚠ Trace a bit more of the word before finishing.</div>`; return; }
      App.captures.sentence = { points: allPts, idealTemplate: { points: flatGuide, aspect: 2.0 } };
      setBanner('green','✨ ML Kit: Word "HERO" recognized!');
      setTimeout(()=>{ App.gameIndex++; render(); }, 800);
    });
    controls.appendChild(doneBtn);
  }
}

function computeFinalResults(){
  const spiral = App.captures.spiral;
  const bug = App.captures.bug;
  const wand = App.captures.wand;
  const sentence = App.captures.sentence;

  const allPoints = [];
  let targetTemplate = { aspect: 1.0, points: [] };
  if(spiral && spiral.points) { allPoints.push(...spiral.points); targetTemplate = spiral.idealTemplate; }
  if(wand && wand.points) allPoints.push(...wand.points);
  if(sentence && sentence.points) allPoints.push(...sentence.points);

  const realMetrics = computeRealKinematics(allPoints, App.inputType, targetTemplate);
  App.liveMetrics = realMetrics;
  if(realMetrics){
    App.weakestSkill = Object.keys(realMetrics).reduce((a,b)=> realMetrics[a]<=realMetrics[b]?a:b);
    if(App.weakestSkill==='movement_smoothness') App.practiceFamilyKey = 'counter_clockwise';
    else if(App.weakestSkill==='pacing_consistency') App.practiceFamilyKey = 'lines';
    else if(App.weakestSkill==='spatial_proportionality') App.practiceFamilyKey = 'clockwise';
    else App.practiceFamilyKey = 'zigzag';
  }
}

function mountStrokeReplay(){
  const canvas = document.getElementById('replay-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const spiral = App.captures.spiral;
  const cx=300, cy=300, maxR=230, ideal = generateSpiral(cx,cy,maxR,3,420);
  const pts = spiral ? spiral.points : [];
  const t0 = pts.length ? pts[0].t : 0;
  const tEnd = pts.length ? pts[pts.length-1].t - t0 : 1;

  function drawIdeal(){
    ctx.strokeStyle='#4B4590'; ctx.lineWidth=3; ctx.setLineDash([2,9]);
    ctx.beginPath(); ideal.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
    ctx.setLineDash([]);
  }
  function drawUpTo(frac){
    ctx.clearRect(0,0,600,600); drawIdeal();
    if(!pts.length) return;
    const targetT = t0 + frac*tEnd;
    ctx.strokeStyle='#34D399'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); let started=false;
    for(let i=0;i<pts.length;i++){
      if(pts[i].t>targetT) break;
      if(!started){ ctx.moveTo(pts[i].x,pts[i].y); started=true; } else ctx.lineTo(pts[i].x,pts[i].y);
    }
    ctx.stroke();
  }
  drawUpTo(0);

  let playing=false, raf=null, startPerf=null, startFrac=0;
  const scrub = document.getElementById('replay-scrub');
  const playBtn = document.getElementById('replay-play');

  function step(ts){
    if(!startPerf) startPerf=ts;
    let frac = startFrac + ((ts-startPerf)/1000)/(Math.max(tEnd/1000, 0.4));
    if(frac>=1){ frac=1; playing=false; playBtn.textContent='▶'; }
    scrub.value = Math.round(frac*1000); drawUpTo(frac);
    if(playing) raf=requestAnimationFrame(step);
  }
  playBtn.addEventListener('click', ()=>{
    if(playing){ playing=false; playBtn.textContent='▶'; cancelAnimationFrame(raf); return; }
    playing=true; playBtn.textContent='❚❚'; startPerf=null; startFrac=scrub.value/1000;
    raf=requestAnimationFrame(step);
  });
  scrub.addEventListener('input', ()=>{ playing=false; playBtn.textContent='▶'; cancelAnimationFrame(raf); drawUpTo(scrub.value/1000); });
}

function mountPracticeCanvas(targetStrokes){
  const canvas = document.getElementById('practice-canvas');
  const ctx = canvas.getContext('2d');
  let drawing=false, points=[];

  const flatGuide = targetStrokes.flat();

  function drawBase(){
    ctx.clearRect(0,0,600,600);
    ctx.save();

    // 1. Draw the dashed guide strokes
    ctx.setLineDash([4,8]); ctx.strokeStyle='#C9CBEF'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
    targetStrokes.forEach(stroke => {
      if(!stroke.length) return;
      ctx.beginPath();
      stroke.forEach((p,i)=> i===0? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
      ctx.stroke();
    });
    ctx.setLineDash([]);

    // 2. Draw pen-lift connector lines between consecutive strokes
    if(targetStrokes.length > 1){
      ctx.save();
      ctx.setLineDash([3,6]); ctx.strokeStyle='rgba(79,70,229,0.25)'; ctx.lineWidth=2;
      for(let s=0; s<targetStrokes.length-1; s++){
        const endP = targetStrokes[s][targetStrokes[s].length-1];
        const startNext = targetStrokes[s+1][0];
        if(endP && startNext){
          ctx.beginPath(); ctx.moveTo(endP.x, endP.y); ctx.lineTo(startNext.x, startNext.y); ctx.stroke();
          // small "lift" icon at midpoint
          const mx = (endP.x + startNext.x)/2, my = (endP.y + startNext.y)/2;
          ctx.fillStyle='rgba(79,70,229,0.35)'; ctx.font='bold 11px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText('✋', mx, my - 10);
        }
      }
      ctx.setLineDash([]);
      ctx.restore();
    }

    // 3. Draw start dots (filled circle) + stroke number labels
    targetStrokes.forEach((stroke, sIdx) => {
      if(!stroke.length) return;
      const startP = stroke[0];
      // Filled indigo circle
      ctx.fillStyle='#4F46E5';
      ctx.beginPath(); ctx.arc(startP.x, startP.y, 10, 0, Math.PI*2); ctx.fill();
      // White stroke number inside
      ctx.fillStyle='#fff'; ctx.font='bold 11px Inter, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(sIdx+1), startP.x, startP.y + 0.5);

      // 4. Draw end-of-stroke square marker (where pen lifts)
      const endP = stroke[stroke.length-1];
      ctx.strokeStyle='#E04D6A'; ctx.lineWidth=2.5;
      ctx.strokeRect(endP.x - 6, endP.y - 6, 12, 12);

      // 5. Draw single directional arrow at midpoint of stroke
      if(stroke.length > 8){
        const midIdx = Math.floor(stroke.length / 2);
        const p1 = stroke[midIdx];
        const p2 = stroke[Math.min(midIdx + 4, stroke.length-1)];
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        ctx.save();
        ctx.fillStyle='#4F46E5';
        ctx.translate(p1.x, p1.y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(10, 0); ctx.lineTo(-7, -6); ctx.lineTo(-7, 6); ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    });

    ctx.restore();
  }
  drawBase();
  function banner(color,text){ const b=document.getElementById('practice-banner'); if(b) b.innerHTML = `<span class="dot ${color}"></span> ${text}`; }

  canvas.addEventListener('pointerdown',(e)=>{ canvas.setPointerCapture(e.pointerId); drawing=true; points=[canvasPointFromEvent(e,canvas)]; });
  canvas.addEventListener('pointermove',(e)=>{
    if(!drawing) return;
    const p = canvasPointFromEvent(e,canvas); const prev = points[points.length-1]; points.push(p);
    let minD = Infinity; for(let j=0; j<flatGuide.length; j+=4){ const d = dist(p, flatGuide[j]); if(d < minD) minD = d; }
    const good = minD < 28;
    ctx.beginPath(); ctx.moveTo(prev.x,prev.y); ctx.lineTo(p.x,p.y); ctx.lineWidth=6; ctx.lineCap='round'; ctx.strokeStyle = good? '#34D399':'#F59E0B'; ctx.stroke();
    banner(good?'green':'amber', good?'Right on track':'Ease back toward the line');
  });
  canvas.addEventListener('pointerup',()=>{
    if(!drawing) return; drawing=false;
    if(points.length<8){ document.getElementById('practice-toast').innerHTML = `<div class="validation-toast">⚠ Give it a slightly longer trace.</div>`; return; }
    
    const dtw = computeDTWDistance(points, flatGuide);
    const accuracy = clamp(100 - (dtw * 1.8), 20, 99);
    App.practiceAccuracy = Math.round(accuracy);
    const pass = accuracy >= 85;

    const toastSlot = document.getElementById('practice-toast');
    const nextBtn = document.getElementById('next-rung-btn');
    const progBtn = document.getElementById('progress-btn');

    if(pass){
      if(App.practiceLevel < 2){
        toastSlot.innerHTML = `
          <div class="validation-toast" style="background:#E4FAF1; border-color:#34D399; color:#0F9D6B;">
            ✓ <strong>${Math.round(accuracy)}% Accuracy — Rung Unlocked!</strong><br>
            Great job! Tap "Advance Rung" to move to the next level.
          </div>`;
        if(nextBtn) nextBtn.style.display = 'inline-flex';
      } else {
        toastSlot.innerHTML = `
          <div class="validation-toast" style="background:#E4FAF1; border-color:#34D399; color:#0F9D6B;">
            🎉 <strong>${Math.round(accuracy)}% Accuracy — Word Mastered!</strong><br>
            You completed the full Progress Ladder!
          </div>`;
        if(progBtn) progBtn.style.display = 'inline-flex';
      }
    } else {
      toastSlot.innerHTML = `
        <div class="validation-toast" style="background:#FFF7E8; border-color:#F59E0B; color:#B97008;">
          ${Math.round(accuracy)}% Accuracy (Target: 85%+).<br>
          Try tracing smoothly once more to unlock the next rung!
        </div>`;
    }
  });
  
  document.getElementById('practice-reset').addEventListener('click', ()=>{
    drawing=false; points=[]; drawBase(); document.getElementById('practice-toast').innerHTML='';
    const nextBtn = document.getElementById('next-rung-btn'); if(nextBtn) nextBtn.style.display='none';
    const progBtn = document.getElementById('progress-btn'); if(progBtn) progBtn.style.display='none';
  });
}
